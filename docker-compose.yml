services:
  skedly-scheduler:
    image: ghcr.io/sam97s/skedly-scheduler:latest
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: "/data/skedly-scheduler.db"
      WORKER_INTERVAL_MS: "1000"
      LEASE_MS: "30000"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - skedly_scheduler_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:8080/health',
          r => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  skedly_scheduler_data:
