name: Test and publish media candidate

on:
  push:
    branches:
      - main
      - milestone/media
  workflow_dispatch:

# Candidate releases deliberately never update latest or deploy anything.
permissions:
  contents: read
  packages: write

concurrency:
  group: skedly-media-publish
  cancel-in-progress: false

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build candidate image
        run: docker build --pull -t skedly-scheduler:test .

      - name: Test exact candidate image with M4 and media WAHA mock suite
        run: docker run --rm --entrypoint node skedly-scheduler:test --no-warnings --test /app/test/scheduler.test.js

      - name: Smoke test production entrypoint and persistent volume
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f skedly-smoke >/dev/null 2>&1 || true
            docker volume rm skedly_media_smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create skedly_media_smoke
          docker run -d --name skedly-smoke \
            -e SCHEDULER_API_TOKEN=ci-smoke-token \
            -v skedly_media_smoke:/data skedly-scheduler:test
          ready=false
          for i in $(seq 1 30); do
            if docker exec skedly-smoke node -e '
              fetch("http://localhost:8080/health").then(async r => {
                const d = await r.json();
                process.exit(r.ok && d.apiAuthConfigured && d.db === "ok" ? 0 : 1);
              }).catch(() => process.exit(1));'; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec skedly-smoke test -d /data/media
          docker exec skedly-smoke test -f /data/skedly-scheduler.db
          docker restart skedly-smoke
          for i in $(seq 1 30); do
            if docker exec skedly-smoke node -e '
              fetch("http://localhost:8080/status").then(r => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1));'; then
              break
            fi
            sleep 1
          done
          docker exec skedly-smoke node -e '
            fetch("http://localhost:8080/status", {headers:{Authorization:"Bearer ci-smoke-token"}})
              .then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only tested media candidate and immutable commit tag
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ghcr.io/sam97s/skedly-scheduler
          docker tag skedly-scheduler:test "$image:media"
          docker tag skedly-scheduler:test "$image:media-$COMMIT_SHA"
          docker push "$image:media-$COMMIT_SHA"
          docker push "$image:media"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' skedly-scheduler:test)"
          {
            echo '## Validated media candidate'
            echo "Tag: $image:media"
            echo "Commit tag: $image:media-$COMMIT_SHA"
            echo "Digest: $digest"
            echo 'All tests and entrypoint/volume smoke checks passed. No latest update. No VPS deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
